# Podcast Clipper – výchozí nastavení (v aplikaci se mění v záložce Nastavení).
# Co tu není, bere se z výchozích hodnot v config.py.

language: cs                 # jazyk podcastu ("cs", "en", ... nebo "auto")
whisper_model: auto          # auto = podle výkonu počítače a délky videa; nebo turbo, medium, small, base, large-v3
max_transcribe_minutes: 45   # u režimu auto: nejdelší přijatelná doba přepisu
whisper_device: cpu          # sestavená aplikace běží na procesoru

selection_mode: manual       # manual = ručně přes chat Claude (zdarma), api = automaticky přes API klíč
clip_style: general          # general | thisorthat | stream
layout_mode: auto            # auto = podcast (sleduje obličeje), stream = hra nahoře a kamera dole
stream_cam_corner: br        # kde je kamera ve hře: br, bl, tr, tl
stream_cam_size: 26          # šířka kamery v procentech šířky obrazu
claude_model: claude-sonnet-5-5
clips_per_video: 6           # kolik klipů z jednoho dílu
min_clip_seconds: 25
max_clip_seconds: 75

min_video_minutes: 10        # kratší videa kanálu se přeskočí
keep_source: false           # true = nemazat stažené původní video

subtitles:
  size: 78
  uppercase: false
  words_per_line: 3
  style: karaoke             # karaoke | box | plain | word (jedno slovo)
  highlight_color: "FFD400"  # barva právě vyslovovaného slova (RGB hex)
