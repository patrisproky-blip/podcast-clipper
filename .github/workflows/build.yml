name: Sestavit aplikaci

# Spouští se samo po nahrání souborů do repozitáře (nebo ručně: Actions -> Run workflow).
# Hotové programy se po dokončení objeví na stránce Releases (vpravo na hlavní stránce repozitáře).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalace závislostí
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller imageio-ffmpeg

      - name: Sestavení aplikace
        shell: bash
        run: |
          status=0
          python build.py > build.log 2>&1 || status=$?
          tail -n 60 build.log
          exit $status

      - name: Samotest aplikace (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\PodcastClipper\PodcastClipper.exe" -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path "$HOME\PodcastClipper\selftest.log") { Get-Content "$HOME\PodcastClipper\selftest.log" } else { Write-Host "selftest.log nevznikl" }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Samotest aplikace (macOS)
        if: runner.os == 'macOS'
        run: |
          status=0
          dist/PodcastClipper.app/Contents/MacOS/PodcastClipper --selftest || status=$?
          cat ~/PodcastClipper/selftest.log || true
          exit $status

      - name: Zabalení (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: 7z a -tzip PodcastClipper-Windows.zip .\dist\PodcastClipper

      - name: Zabalení (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/PodcastClipper.app PodcastClipper-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PodcastClipper-${{ matrix.label }}
          path: PodcastClipper-*.zip
          retention-days: 30

      - name: Uložit výsledek samotestu
        if: always()
        shell: bash
        run: cp "$HOME/PodcastClipper/selftest.log" "selftest-${{ matrix.label }}.log" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-${{ matrix.label }}
          path: selftest-*.log
          if-no-files-found: ignore

      - name: Zapsat log při chybě
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '```'; tail -n 70 build.log 2>/dev/null; echo '```'
            echo; echo 'selftest.log:'; echo '```'; cat "$HOME/PodcastClipper/selftest.log" 2>/dev/null; echo '```'
          } > notes.txt
          gh release create "buildlog-${{ github.run_number }}-${{ matrix.label }}" --prerelease \
            --title "Log chyby (${{ matrix.label }}, sestavení ${{ github.run_number }})" --notes-file notes.txt

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: PodcastClipper-*
          merge-multiple: true

      - run: ls -la release

      - uses: actions/download-artifact@v4
        with:
          path: selftests
          pattern: selftest-*
          merge-multiple: true

      - name: Sestavit popis vydání
        shell: bash
        run: |
          {
            echo "Stáhněte zip pro svůj systém (Windows nebo macOS), rozbalte a spusťte. Návod je v souboru README.md."
            echo; echo "Výsledek samotestu:"
            for f in selftests/*.log; do
              [ -e "$f" ] || continue
              echo; echo "$(basename "$f")"; echo '```'; cat "$f"; echo '```'
            done
          } > body.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Podcast Clipper (sestavení ${{ github.run_number }})
          body_path: body.md
          files: release/*.zip
          make_latest: true
